<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{SUTTA_TITLE}}</title>
    <style>
        :root {
        --font-size: 16px;
        }
        * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        }
        body {
        font-family: "Noto Sans", "Roboto", serif;
        font-size: var(--font-size);
        line-height: 1.8;
        color: #212121;
        background-color: #FFFDF5;
        padding: 7.2em 16px 80px 16px;
        -webkit-tap-highlight-color: transparent;
        }
        /* ── Плавное появление/исчезновение UI ── */
        .ui-fade {
        transition: opacity 0.3s ease, transform 0.3s ease;
        opacity: 1;
        }
        body.ui-hidden .ui-fade {
        opacity: 0;
        pointer-events: none;
        }
        body.ui-hidden .sutta-header {
        transform: translateY(-10px);
        }
        body.ui-hidden .sutta-footer {
        transform: translateY(10px);
        }
        body.ui-hidden .cm-btn,
        body.ui-hidden .share-btn {
        transform: translateY(-10px);
        }
        body.ui-hidden .bm-btn {
        transform: translateY(-10px);
        }
        body.ui-hidden .nav-btn {
        transform: translateX(0);
        opacity: 0;
        }
        body.ui-hidden .nav-prev { transform: translateX(-10px); }
        body.ui-hidden .nav-next { transform: translateX(10px); }
        body.ui-hidden .next-btn {
        transform: translateY(20px);
        }
        /* В режиме скрытия контент занимает весь экран */
        body.ui-hidden {
        padding-top: 2em;
        padding-bottom: 2em;
        }
        /* ── Плавающие кнопки: А / Т слева, 📤 / 🔖 справа ── */
        .bm-btn, .cm-btn, .share-btn {
        position: fixed;
        top: 8px;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: 1px solid rgba(141, 110, 99, 0.55);
        background: rgba(141, 110, 99, 0.30);
        color: #5D4037;
        font-size: 16px;
        line-height: 1;
        cursor: pointer;
        z-index: 60;
        opacity: 0.8;
        }
        .cm-btn {
        font-weight: bold;
        }
        #attBtn { left: 10px; }
        #tikBtn { left: 56px; }
        .bm-btn {
        right: 10px;
        font-size: 18px;
        }
        .share-btn {
        right: 56px;
        font-size: 18px;
        }
        .bm-btn:active, .cm-btn:active, .share-btn:active {
        background: rgba(141, 110, 99, 0.55);
        }
        .bm-btn.on {
        background: rgba(141, 110, 99, 0.85);
        border-color: rgba(141, 110, 99, 0.9);
        color: #FFFFFF;
        }
        /* ── Кнопки назад/вперёд ── */
        .nav-btn {
        position: fixed;
        top: 50%;
        transform: translateY(-50%);
        width: 20px;
        height: 32px;
        border-radius: 10px;
        border: 1px solid rgba(141, 110, 99, 0.55);
        background: rgba(141, 110, 99, 0.30);
        color: #C62828;
        font-size: 12px;
        line-height: 1;
        cursor: pointer;
        z-index: 55;
        opacity: 0.8;
        }
        .nav-btn:active {
        background: rgba(141, 110, 99, 0.55);
        }
        .nav-prev { left: 6px; }
        .nav-next { right: 6px; }
        /* ── Следующая случайная сутта ── */
        .next-btn {
        position: fixed;
        bottom: 50px;
        right: 12px;
        width: 52px;
        height: 52px;
        border-radius: 50%;
        border: none;
        background: #8D6E63;
        color: #FFFFFF;
        font-size: 22px;
        line-height: 1;
        cursor: pointer;
        box-shadow: 0 3px 10px rgba(0,0,0,0.25);
        z-index: 60;
        }
        .next-btn:active {
        background: #5D4037;
        }
        .sutta-header {
        text-align: center;
        margin-bottom: 24px;
        padding-bottom: 16px;
        border-bottom: 2px solid #D7CCC8;
        }
        .sutta-uid {
        font-size: 0.85em;
        color: #9E9E9E;
        margin-bottom: 4px;
        }
        .sutta-title {
        font-size: 1.5em;
        font-weight: bold;
        color: #5D4037;
        margin-bottom: 6px;
        }
        .sutta-meta {
        font-size: 0.9em;
        color: #757575;
        }
        .sutta-content {
        text-align: justify;
        white-space: pre-wrap;
        }
        .sutta-content p {
        margin-bottom: 1em;
        text-indent: 1.5em;
        }
        .sub-heading {
        font-weight: bold;
        color: #6D4C41;
        margin: 1.5em 0 0.5em 0;
        text-indent: 0;
        }
        mark.hl {
        background: #FFE082;
        color: #212121;
        padding: 0 2px;
        border-radius: 3px;
        }
        .sutta-footer {
        margin-top: 32px;
        padding-top: 16px;
        border-top: 1px solid #E0E0E0;
        font-size: 0.85em;
        color: #9E9E9E;
        text-align: center;
        }
        /* ── Модальное окно шаринга ── */
        .share-overlay {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.5);
        z-index: 100;
        display: none;
        align-items: center;
        justify-content: center;
        }
        .share-overlay.show {
        display: flex;
        }
        .share-dialog {
        background: #FFFDF5;
        border-radius: 16px;
        padding: 24px 20px;
        width: 280px;
        box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
        .share-title {
        font-size: 1.1em;
        font-weight: bold;
        color: #5D4037;
        text-align: center;
        margin-bottom: 18px;
        }
        .share-option {
        display: flex;
        align-items: center;
        padding: 14px 16px;
        margin: 8px 0;
        background: rgba(141, 110, 99, 0.12);
        border: 1px solid rgba(141, 110, 99, 0.35);
        border-radius: 12px;
        cursor: pointer;
        color: #5D4037;
        font-weight: 500;
        }
        .share-option:active {
        background: rgba(141, 110, 99, 0.28);
        }
        .share-option-icon {
        font-size: 1.4em;
        margin-right: 14px;
        }
        .share-cancel {
        display: block;
        width: 100%;
        padding: 12px;
        margin-top: 10px;
        background: transparent;
        border: none;
        color: #9E9E9E;
        font-size: 0.95em;
        cursor: pointer;
        }
        .share-cancel:active {
        color: #5D4037;
        }
    </style>
</head>
<body>
<button id="attBtn" class="cm-btn ui-fade" onclick="openComment('att')">А</button>
<button id="tikBtn" class="cm-btn ui-fade" onclick="openComment('tik')">Т</button>
<button id="shareBtn" class="share-btn ui-fade" onclick="showShareDialog()">📤</button>
<button id="bmBtn" class="bm-btn ui-fade" onclick="toggleBookmark()">🔖</button>
<button id="prevSuttaBtn" class="nav-btn nav-prev ui-fade" onclick="prevSutta()">❮</button>
<button id="nextSuttaBtn" class="nav-btn nav-next ui-fade" onclick="nextSutta()">❯</button>
<button id="nextBtn" class="next-btn ui-fade" style="display:none;" onclick="nextRandom()">🎲</button>
<div class="sutta-header ui-fade">
    <div class="sutta-uid">{{SUTTA_UID}}</div>
    <div class="sutta-title">{{SUTTA_TITLE}}</div>
    <div class="sutta-meta">{{SUTTA_META}}</div>
</div>
<div class="sutta-content">
    {{SUTTA_CONTENT}}
</div>
<div class="sutta-footer ui-fade">
    Источник: OpenTipitaka · Лицензия: CC BY-NC-SA 4.0
</div>
<!-- Модальное окно шаринга -->
<div id="shareOverlay" class="share-overlay" onclick="closeShareDialog(event)">
    <div class="share-dialog" onclick="event.stopPropagation()">
        <div class="share-title">Поделиться суттой</div>
        <div class="share-option" onclick="shareAsText()">
            <span class="share-option-icon">📄</span>
            <span>Текстом</span>
        </div>
        <div class="share-option" onclick="shareAsPdf()">
            <span class="share-option-icon">📑</span>
            <span>PDF документом</span>
        </div>
        <button class="share-cancel" onclick="hideShareDialog()">Отмена</button>
    </div>
</div>
<script>
    function changeFontSize(delta) {
    var root = document.documentElement;
    var current = parseFloat(getComputedStyle(root).getPropertyValue('--font-size'));
    var newSize = current + delta;
    if (newSize < 12) newSize = 12;
    if (newSize > 28) newSize = 28;
    root.style.setProperty('--font-size', newSize + 'px');
    }
    function setFontSize(size) {
    var root = document.documentElement;
    root.style.setProperty('--font-size', size + 'px');
    }
    function toggleBookmark() {
    if (typeof Android !== 'undefined') {
    Android.toggleBookmark(Math.round(window.scrollY));
    }
    }
    function setBookmarkState(on) {
    var b = document.getElementById('bmBtn');
    if (on) { b.classList.add('on'); b.textContent = '✅'; }
    else    { b.classList.remove('on'); b.textContent = '🔖'; }
    }
    function setRandomMode(on) {
    var b = document.getElementById('nextBtn');
    if (b) b.style.display = on ? 'block' : 'none';
    }
    function nextRandom() {
    if (typeof Android !== 'undefined') Android.nextRandom();
    }
    function openComment(kind) {
    if (typeof Android !== 'undefined') Android.openComment(kind);
    }
    function prevSutta() {
    if (typeof Android !== 'undefined') Android.openPrevSutta();
    }
    function nextSutta() {
    if (typeof Android !== 'undefined') Android.openNextSutta();
    }
    /* ── Шаринг сутты ── */
    function showShareDialog() {
    document.getElementById('shareOverlay').classList.add('show');
    }
    function hideShareDialog() {
    document.getElementById('shareOverlay').classList.remove('show');
    }
    function closeShareDialog(event) {
    if (event.target === document.getElementById('shareOverlay')) {
    hideShareDialog();
    }
    }
    function shareAsText() {
    hideShareDialog();
    if (typeof Android !== 'undefined') Android.shareSuttaAsText();
    }
    function shareAsPdf() {
    hideShareDialog();
    if (typeof Android !== 'undefined') Android.shareSuttaAsPdf();
    }
    /* ── НОВОЕ: Скрытие/показ UI по тапу на экран ── */
    function toggleUI() {
    document.body.classList.toggle('ui-hidden');
    }
    document.addEventListener('click', function(e) {
    // Не реагируем на клики по интерактивным элементам
    if (e.target.closest('button, a, input, textarea, .share-overlay, .share-dialog, mark')) {
    return;
    }
    // Не реагируем, если модальное окно открыто
    if (document.getElementById('shareOverlay').classList.contains('show')) {
    return;
    }
    toggleUI();
    });
    function highlightQuery(q) {
    if (!q) return;
    var terms = q.toLowerCase().split(/\s+/).filter(function(t) { return t.length >= 3; });
    if (terms.length === 0) return;
    var content = document.querySelector('.sutta-content');
    if (!content) return;
    var walker = document.createTreeWalker(content, NodeFilter.SHOW_TEXT, null);
    var nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    var firstMark = null;
    nodes.forEach(function(node) {
    var text = node.nodeValue;
    var lower = text.toLowerCase();
    var ranges = [];
    terms.forEach(function(t) {
    var idx = lower.indexOf(t);
    while (idx !== -1) {
    ranges.push([idx, t.length]);
    idx = lower.indexOf(t, idx + t.length);
    }
    });
    if (ranges.length === 0) return;
    ranges.sort(function(a, b) { return a[0] - b[0]; });
    var merged = [];
    ranges.forEach(function(r) {
    if (merged.length && r[0] < merged[merged.length - 1][0] + merged[merged.length - 1][1]) {
    var last = merged[merged.length - 1];
    last[1] = Math.max(last[1], r[0] + r[1] - last[0]);
    } else {
    merged.push(r);
    }
    });
    var frag = document.createDocumentFragment();
    var pos = 0;
    merged.forEach(function(r) {
    if (r[0] > pos) frag.appendChild(document.createTextNode(text.slice(pos, r[0])));
    var mark = document.createElement('mark');
    mark.className = 'hl';
    mark.textContent = text.slice(r[0], r[0] + r[1]);
    frag.appendChild(mark);
    if (!firstMark) firstMark = mark;
    pos = r[0] + r[1];
    });
    if (pos < text.length) frag.appendChild(document.createTextNode(text.slice(pos)));
    node.parentNode.replaceChild(frag, node);
    });
    if (firstMark) {
    setTimeout(function() {
    var y = firstMark.getBoundingClientRect().top + window.scrollY - 100;
    if (y < 0) y = 0;
    window.scrollTo(0, y);
    }, 200);
    }
    }
</script>
</body>
</html>
