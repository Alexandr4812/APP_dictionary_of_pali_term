<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Поиск</title>
    <style>
        :root { --font-size: 16px; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
        font-family: "Noto Sans", "Roboto", sans-serif;
        font-size: var(--font-size);
        line-height: 1.6;
        color: #E2E8F0;
        background-color: #161923;
        padding: 16px;
        padding-bottom: 80px;
        }
        .nikaya-title {
        text-align: center;
        font-size: 1.4em;
        font-weight: bold;
        color: #FFE082;
        margin-bottom: 20px;
        padding-bottom: 10px;
        border-bottom: 2px solid #2D3748;
        }
        .search-box { display: flex; gap: 8px; margin-bottom: 12px; }
        #q {
        flex: 1;
        padding: 10px 12px;
        font-size: 1em;
        border: 1px solid #2D3748;
        border-radius: 6px;
        background: #1E2430;
        color: #E2E8F0;
        }
        #go {
        padding: 10px 18px;
        font-size: 1em;
        font-weight: bold;
        color: #161923;
        background: #FFE082;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        }
        #go:active { background: #E6C55C; }
        .search-count {
        font-size: 0.9em;
        color: #94A3B8;
        margin-bottom: 12px;
        }
        .sutta-item {
        display: block;
        padding: 12px 14px;
        margin: 6px 0;
        background-color: rgba(255,255,255,0.03);
        border: 1px solid #2D3748;
        border-left: 4px solid #FFE082;
        border-radius: 4px;
        text-decoration: none;
        color: #E2E8F0;
        }
        .sutta-item:active { background-color: rgba(255,255,255,0.08); }
        .sutta-title { font-weight: 500; display: block; }
        .sutta-uid {
        float: right;
        font-size: 0.75em;
        color: #64748B;
        margin-left: 8px;
        }
        .search-snippet {
        font-size: 0.85em;
        color: #94A3B8;
        margin-top: 6px;
        }
        .search-snippet b { color: #FFE082; }
    </style>
</head>
<body>
<div class="nikaya-title">Поиск по Типитаке</div>
<div class="search-box">
    <input id="q" type="text" placeholder="Например: Ананда, сострадание, anapana…" value="{{QUERY}}">
    <button id="go" onclick="runSearch()">Найти</button>
</div>
<div id="count" class="search-count"></div>
<div id="results">{{RESULTS}}</div>
<script>
    function changeFontSize(delta) {
    var root = document.documentElement;
    var current = parseFloat(getComputedStyle(root).getPropertyValue('--font-size'));
    var newSize = current + delta;
    if (newSize < 12) newSize = 12;
    if (newSize > 28) newSize = 28;
    root.style.setProperty('--font-size', newSize + 'px');
    }
    function setFontSize(size) {
    var root = document.documentElement;
    root.style.setProperty('--font-size', size + 'px');
    }
    function runSearch() {
    var q = document.getElementById('q').value;
    var data = JSON.parse(AndroidSearch.search(q));
    document.getElementById('count').textContent =
    data.count > 0 ? ('Найдено: ' + data.count + ' (показаны первые 300)') : '';
    document.getElementById('results').innerHTML = data.html;
    }
    document.getElementById('q').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') { runSearch(); }
    });
    window.addEventListener('load', function() {
    var results = document.getElementById('results');
    var q = document.getElementById('q').value.trim();

    /* Если результаты уже подставлены из Android (возврат из сутты) —
       просто восстанавливаем счётчик и НЕ ищем заново */
    if (results.innerHTML.trim() !== '') {
    var items = results.querySelectorAll('.sutta-item');
    if (items.length > 0) {
    document.getElementById('count').textContent =
    'Найдено: ' + items.length + (items.length >= 300 ? ' (показаны первые 300)' : '');
    }
    return;
    }

    /* Иначе, если поле не пустое — запускаем поиск */
    if (q !== '') { runSearch(); }
    });
</script>
</body>
</html>
